services:
  # Backend API
  - type: web
    name: budget-app-backend
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: budget-app-db
          property: connectionString
      # IMPORTANT: JWT_SECRET must be set manually in Render Dashboard
      # Using sync: false ensures it stays constant across deploys
      # Changing JWT_SECRET will invalidate all user sessions!
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30d

  # Remote MCP server — lets each budget-app user connect their own AI client
  # (e.g. claude.ai custom connectors) via OAuth, acting under their own identity.
  - type: web
    name: budget-mcp-server
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: cd mcp-server && npm install
    startCommand: cd mcp-server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: budget-app-db
          property: connectionString
      - key: BUDGET_API_URL
        value: https://budget-app-backend-r7x1.onrender.com/api

  # Frontend (Static Site)
  - type: web
    name: budget-app-frontend
    runtime: static
    buildCommand: cd frontend && chmod +x build.sh && ./build.sh
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://budget-app-backend-r7x1.onrender.com/api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://budget-app-backend-r7x1.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

# NOTE: Database budget-app-db already exists in Render - do NOT recreate
# The database is on a paid plan and contains production data
